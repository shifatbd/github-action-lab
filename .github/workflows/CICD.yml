name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-slim
    steps:
      - name: Clone the code
        run: echo "cloning started"
  build:
    needs: [code]
    runs-on: ubuntu-slim
    steps:
      - name: Build the code
        run: echo "build started"
  test:
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - name: Test the code
        run: echo "Test have started"
  deploy:
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - name: Deploy the code
        run: echo "Deployment have started"
